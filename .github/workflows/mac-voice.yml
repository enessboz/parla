name: macOS voice test (Whisper + Kokoro)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/backend/stt.py', 'app/backend/tts.py', 'app/backend/main.py', 'app/frontend/**', '.github/workflows/mac-voice.yml']
jobs:
  voice:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Python + packages
        run: |
          set -o pipefail
          (EP_BOOTSTRAP_ONLY=1 bash kurulum.sh && runtime/python/bin/python3 -m pip install -q --no-cache-dir -r app/requirements.txt) 2>&1 | tee boot.log || { tail -15 boot.log | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Kokoro voice files
        run: |
          mkdir -p models/tts/kokoro && cd models/tts/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fL -sS -O $B/kokoro-v1.0.onnx && curl -fL -sS -O $B/voices-v1.0.bin && ls -la
      - name: Machine profile
        run: |
          PYTHONPATH=app:. runtime/python/bin/python3 -c "
          from backend import machine
          machine.save_profile({'default_model': 'gemma3:4b', 'whisper_model': 'base.en', 'whisper_device': 'cpu'})
          print(machine.profile_path())"
      - name: Start app (speech on) + fake Ollama
        run: |
          PY=$PWD/runtime/python/bin/python3
          (cd dev/tests && nohup $PY -m uvicorn fake_ollama:app --port 11500 > /tmp/fake.log 2>&1 &)
          (cd app && EP_DATA_DIR=/tmp/epdata OLLAMA_HOST=127.0.0.1:11500 PYTHONPATH=$PWD/.. nohup $PY -m uvicorn backend.main:app --host 127.0.0.1 --port 8100 > /tmp/app.log 2>&1 &)
          for i in $(seq 1 240); do
            H=$(curl -sf localhost:8100/api/health || true)
            echo "$H" | grep -q '"whisper":{"ok":true' && echo "$H" | grep -q '"tts":{"ok":true' && break
            sleep 2
          done
          echo "::notice::health $(curl -sS localhost:8100/api/health | head -c 600)"
          curl -sf localhost:8100/api/health | grep -q '"whisper":{"ok":true' || { tail -25 /tmp/app.log | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - name: Voice turn (sample.wav -> Whisper -> reply)
        run: |
          set -o pipefail
          runtime/python/bin/python3 dev/tests/ws_test.py 8100 2>&1 | tee /tmp/ws.out || { tail -15 /tmp/ws.out | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          echo "::notice::ws_test $(tail -12 /tmp/ws.out | tr '\n' '|' | head -c 900)"
      - name: TTS (Kokoro) audio chunks
        run: |
          set -o pipefail
          runtime/python/bin/python3 dev/tests/ws_tts_test.py 8100 2>&1 | tee /tmp/tts.out || { tail -15 /tmp/tts.out | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
          echo "::notice::ws_tts_test $(tail -12 /tmp/tts.out | tr '\n' '|' | head -c 900)"
