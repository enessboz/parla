name: Build native Swift app (experimental)
on:
  push:
    branches: [main]
    paths: ['native-swift/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: native-swift
        run: |
          set -o pipefail
          ./build_app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -9 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }
      - name: Zip
        working-directory: native-swift
        run: ditto -c -k --keepParent EnglishPractice.app EnglishPractice-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-mac
          path: native-swift/EnglishPractice-mac.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete native-swift -y --cleanup-tag || true
          gh release create native-swift native-swift/EnglishPractice-mac.zip --title "Native Swift build (experimental)" --notes "Automated build of ${{ github.sha }}"
