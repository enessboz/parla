name: Build macOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build_app.sh
      - name: Zip
        run: ditto -c -k --keepParent EnglishPractice.app EnglishPractice-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-mac
          path: EnglishPractice-mac.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest EnglishPractice-mac.zip --title "Latest build" --notes "Automated build of ${{ github.sha }}"
